<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Retro Runner</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none; }
  html, body { height:100%; overflow:hidden; background:#1a2b4a; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
  #wrap {
    width:100%; height:100%;
    display:flex; flex-direction:column;
    background: linear-gradient(180deg, #4a7fc9 0%, #7ba8e0 40%, #a8cef0 100%);
  }
  #topbar {
    height:44px; flex-shrink:0;
    background: linear-gradient(180deg, #2255aa 0%, #123a77 100%);
    border-bottom: 2px solid #0a2450;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 10px; color:#eaf2ff; font-size:14px; font-weight:bold;
    text-shadow: 1px 1px 1px rgba(0,0,0,0.4);
  }
  #canvasHolder { flex:1; position:relative; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; }
  #overlay {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    background: rgba(10,25,55,0.75); color:#fff; text-align:center; padding:20px;
  }
  #overlay h1 { font-size:26px; margin-bottom:10px; text-shadow:2px 2px 0 #0a2450; }
  #overlay p { font-size:14px; margin-bottom:16px; opacity:0.9; line-height:1.5; }
  .btn {
    background: linear-gradient(180deg, #5aa0f0 0%, #2255aa 100%);
    border: 2px solid #0a2450;
    border-radius: 8px;
    color:#fff; font-size:16px; font-weight:bold;
    padding:10px 28px;
    box-shadow: 0 3px 0 #0a2450, inset 0 1px 0 rgba(255,255,255,0.4);
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #0a2450; }
  #hidden { display:none; }
</style>
</head>
<body>
<div id="wrap">
  <div id="topbar">
    <span id="scoreLbl">Очки: 0</span>
    <span id="bestLbl">Рекорд: 0</span>
  </div>
  <div id="canvasHolder">
    <canvas id="game"></canvas>
    <div id="overlay">
      <h1>Retro Runner</h1>
      <p>Человечек бежит сам.<br>Тапни по экрану, чтобы прыгнуть.<br>Собирай монетки, перепрыгивай преграды.</p>
      <button class="btn" id="startBtn">Старт</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const holder = document.getElementById('canvasHolder');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const scoreLbl = document.getElementById('scoreLbl');
const bestLbl = document.getElementById('bestLbl');

let W, H, groundY;
function resize(){
  W = holder.clientWidth;
  H = holder.clientHeight;
  canvas.width = W * devicePixelRatio;
  canvas.height = H * devicePixelRatio;
  canvas.style.width = W+'px';
  canvas.style.height = H+'px';
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  groundY = H - 70;
}
window.addEventListener('resize', resize);
resize();

let best = 0;
try { best = parseInt(localStorage.getItem('rr_best')||'0'); } catch(e) { best = 0; }
bestLbl.textContent = 'Рекорд: ' + best;

let running = false;
let score = 0;
let speed = 5;
let frame = 0;

const player = { x:60, y:0, w:26, h:36, vy:0, jumping:false, legPhase:0 };
let obstacles = [];
let coins = [];
let particles = [];

const GRAVITY = 0.85;
const JUMP_V = -15.5;

function reset(){
  score = 0;
  speed = 5.5;
  frame = 0;
  obstacles = [];
  coins = [];
  particles = [];
  player.y = groundY - player.h;
  player.vy = 0;
  player.jumping = false;
}

function jump(){
  if (!running) return;
  if (!player.jumping){
    player.vy = JUMP_V;
    player.jumping = true;
  }
}

function spawnObstacle(){
  const type = Math.random() < 0.5 ? 'block' : 'spike';
  const h = type === 'block' ? 30 + Math.random()*20 : 24;
  obstacles.push({ x: W + 20, y: groundY - h, w: type==='block'?22:26, h: h, type });
}

function spawnCoin(){
  const y = groundY - 60 - Math.random()*60;
  coins.push({ x: W + 20, y: y, r: 8, collected:false, spin:0 });
}

let nextObstacleAt = 60;
let nextCoinAt = 90;

function update(){
  frame++;
  score += 1;
  speed = 5.5 + Math.min(6, score/500);

  player.vy += GRAVITY;
  player.y += player.vy;
  if (player.y > groundY - player.h){
    player.y = groundY - player.h;
    player.vy = 0;
    if (player.jumping) {
      player.jumping = false;
    }
  }
  if (!player.jumping) player.legPhase += 0.35;

  if (frame > nextObstacleAt){
    spawnObstacle();
    nextObstacleAt = frame + 55 + Math.random()*45 - Math.min(30, score/60);
  }
  if (frame > nextCoinAt){
    spawnCoin();
    nextCoinAt = frame + 70 + Math.random()*60;
  }

  for (let i = obstacles.length-1; i>=0; i--){
    const o = obstacles[i];
    o.x -= speed;
    if (o.x + o.w < -10) { obstacles.splice(i,1); continue; }
    if (rectsOverlap(player.x+4, player.y+4, player.w-8, player.h-8, o.x, o.y, o.w, o.h)){
      gameOver();
      return;
    }
  }

  for (let i = coins.length-1; i>=0; i--){
    const c = coins[i];
    c.x -= speed;
    c.spin += 0.2;
    if (c.x < -10) { coins.splice(i,1); continue; }
    const dx = (player.x+player.w/2) - c.x;
    const dy = (player.y+player.h/2) - c.y;
    if (!c.collected && Math.sqrt(dx*dx+dy*dy) < 22){
      c.collected = true;
      score += 25;
      for (let k=0;k<6;k++){
        particles.push({x:c.x,y:c.y,vx:(Math.random()-0.5)*4,vy:(Math.random()-1)*4,life:20,color:'#ffd84a'});
      }
      coins.splice(i,1);
    }
  }

  for (let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.2; p.life--;
    if (p.life<=0) particles.splice(i,1);
  }

  scoreLbl.textContent = 'Очки: ' + score;
}

function rectsOverlap(x1,y1,w1,h1,x2,y2,w2,h2){
  return x1 < x2+w2 && x1+w1 > x2 && y1 < y2+h2 && y1+h1 > y2;
}

function gameOver(){
  running = false;
  if (score > best){
    best = score;
    try { localStorage.setItem('rr_best', String(best)); } catch(e){}
  }
  bestLbl.textContent = 'Рекорд: ' + best;
  overlay.style.display = 'flex';
  overlay.querySelector('h1').textContent = 'Игра окончена';
  overlay.querySelector('p').innerHTML = 'Очки: ' + score + '<br>Рекорд: ' + best;
  startBtn.textContent = 'Ещё раз';
}

function drawGround(){
  ctx.fillStyle = '#2d5a3a';
  ctx.fillRect(0, groundY, W, H-groundY);
  ctx.strokeStyle = '#1c3d26';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, groundY);
  ctx.lineTo(W, groundY);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  const off = (frame*speed) % 20;
  for (let x = -off; x < W; x += 20){
    ctx.beginPath();
    ctx.moveTo(x, groundY+6);
    ctx.lineTo(x+10, groundY+6);
    ctx.stroke();
  }
}

function drawPlayer(){
  const px = player.x, py = player.y, pw = player.w, ph = player.h;
  ctx.save();
  ctx.translate(px, py);
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.ellipse(pw/2, groundY-py+4, pw/2, 4, 0, 0, Math.PI*2);
  ctx.fill();

  // legs
  ctx.strokeStyle = '#123a77';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  const legSwing = player.jumping ? 0.4 : Math.sin(player.legPhase)*0.6;
  ctx.beginPath();
  ctx.moveTo(pw/2-4, ph-14);
  ctx.lineTo(pw/2-4+legSwing*8, ph);
  ctx.moveTo(pw/2+4, ph-14);
  ctx.lineTo(pw/2+4-legSwing*8, ph);
  ctx.stroke();

  // body
  ctx.fillStyle = '#2255aa';
  ctx.beginPath();
  ctx.roundRect(4, 10, pw-8, ph-24, 6);
  ctx.fill();

  // arms
  ctx.strokeStyle = '#2255aa';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(4, 16);
  ctx.lineTo(-2 - legSwing*4, 26);
  ctx.moveTo(pw-4, 16);
  ctx.lineTo(pw+2 + legSwing*4, 26);
  ctx.stroke();

  // head
  ctx.fillStyle = '#ffd9b3';
  ctx.beginPath();
  ctx.arc(pw/2, 6, 9, 0, Math.PI*2);
  ctx.fill();

  // face
  ctx.fillStyle = '#123a77';
  ctx.beginPath();
  ctx.arc(pw/2+3, 5, 1.5, 0, Math.PI*2);
  ctx.fill();

  ctx.restore();
}

function drawObstacle(o){
  if (o.type === 'block'){
    ctx.fillStyle = '#8a5a3a';
    ctx.fillRect(o.x, o.y, o.w, o.h);
    ctx.fillStyle = '#6b4229';
    ctx.fillRect(o.x, o.y, o.w, 4);
  } else {
    ctx.fillStyle = '#aa3333';
    ctx.beginPath();
    ctx.moveTo(o.x, o.y+o.h);
    ctx.lineTo(o.x+o.w/2, o.y);
    ctx.lineTo(o.x+o.w, o.y+o.h);
    ctx.closePath();
    ctx.fill();
  }
}

function drawCoin(c){
  ctx.save();
  ctx.translate(c.x, c.y);
  const sx = Math.abs(Math.cos(c.spin));
  ctx.scale(Math.max(0.15,sx), 1);
  ctx.fillStyle = '#ffd84a';
  ctx.beginPath();
  ctx.arc(0,0,c.r,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#b8860b';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.restore();
}

function drawClouds(){
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  for (let i=0;i<3;i++){
    const cx = ((frame*0.5 + i*160) % (W+120)) - 60;
    const cy = 30 + i*25;
    ctx.beginPath();
    ctx.arc(cx,cy,18,0,Math.PI*2);
    ctx.arc(cx+16,cy+4,14,0,Math.PI*2);
    ctx.arc(cx-16,cy+4,14,0,Math.PI*2);
    ctx.fill();
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  drawClouds();
  drawGround();
  for (const o of obstacles) drawObstacle(o);
  for (const c of coins) drawCoin(c);
  for (const p of particles){
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.max(0,p.life/20);
    ctx.fillRect(p.x,p.y,3,3);
    ctx.globalAlpha = 1;
  }
  drawPlayer();
}

function loop(){
  if (running){
    update();
    draw();
  }
  requestAnimationFrame(loop);
}

startBtn.addEventListener('click', () => {
  overlay.style.display = 'none';
  reset();
  running = true;
});

canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); jump(); });
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') jump();
});

draw();
requestAnimationFrame(loop);
</script>
</body>
</html>
